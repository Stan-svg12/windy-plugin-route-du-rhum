name: publish-plugin

# Publie le plugin sur windy-plugins.com.
# Se lance tout seul quand le code du plugin change sur main, ou à la main (Actions > publish-plugin > Run workflow).
# Prérequis : secret WINDY_API_KEY (clé "Windy Plugins API" créée sur https://api.windy.com/keys).
# Chaque publication doit porter une nouvelle version (champ version de src/pluginConfig.ts).

on:
    workflow_dispatch:
    push:
        branches: [main]
        paths:
            - 'src/**'
            - 'package.json'
            - '.github/workflows/publish-plugin.yml'

permissions:
    contents: write

jobs:
    publish-plugin:
        runs-on: ubuntu-latest
        env:
            WINDY_API_KEY: '${{ secrets.WINDY_API_KEY }}'
        steps:
            - uses: actions/checkout@v7
            - name: Check secret and version
              id: guard
              run: |
                  VERSION=$(grep -oE "version: '[0-9]+\.[0-9]+\.[0-9]+'" src/pluginConfig.ts | grep -oE "[0-9]+\.[0-9]+\.[0-9]+")
                  echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
                  if [ -z "$WINDY_API_KEY" ]; then
                    echo "::warning title=Publication en attente::Ajoute le secret WINDY_API_KEY puis relance ce workflow."
                    echo "skip=true" >> "$GITHUB_OUTPUT"
                  elif [ -f PLUGIN_URL.txt ] && grep -q "/${VERSION}/plugin.min.js" PLUGIN_URL.txt; then
                    echo "::notice title=Déjà publié::La version ${VERSION} est déjà en ligne : $(cat PLUGIN_URL.txt). Augmente la version pour republier."
                    echo "skip=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "skip=false" >> "$GITHUB_OUTPUT"
                  fi
            - name: Inject repository
              if: steps.guard.outputs.skip != 'true'
              run: |
                  # Le plugin lit les trajectoires mises à jour chaque heure dans ce dépôt
                  sed -i "s#__RDR_REPO__#${GITHUB_REPOSITORY}#g" src/lib/config.ts src/pluginConfig.ts package.json
                  grep -n "const REPO\|repository:" src/lib/config.ts src/pluginConfig.ts
            - name: Build
              if: steps.guard.outputs.skip != 'true'
              run: |
                  npm install
                  npm run build
            - name: Publish Plugin
              if: steps.guard.outputs.skip != 'true'
              run: |
                  # Sans pipefail, un refus de Windy passerait inaperçu derrière tee
                  set -o pipefail
                  if [ -z "$WINDY_API_KEY" ]; then
                    echo "Secret WINDY_API_KEY is not configured" >&2
                    exit 1
                  fi
                  cd dist
                  echo "Creating plugin archive..."
                  echo "{\"repositoryName\": \"${{ github.repository }}\", \"commitSha\": \"${{ github.sha }}\", \"repositoryOwner\": \"${{ github.repository_owner }}\"}" > /tmp/plugin-info.json
                  mv plugin.json /tmp
                  jq -s '.[0] * .[1]' /tmp/plugin.json /tmp/plugin-info.json > plugin.json
                  tar cf ../plugin.tar .
                  echo "Publishing plugin..."
                  curl -s --fail-with-body -XPOST 'https://node.windy.com/plugins/v1.0/upload' -H "x-windy-api-key: ${WINDY_API_KEY}" -F "plugin_archive=@../plugin.tar" | tee /tmp/upload.json
                  echo
                  URL=$(sed 's#\\/#/#g' /tmp/upload.json | grep -oE 'https://windy-plugins\.com/[^" ]+plugin\.min\.js' | head -1 || true)
                  echo "PLUGIN_URL=${URL}" >> "$GITHUB_ENV"
                  {
                    echo "## ⛵ Plugin publié"
                    echo
                    echo "Lien à coller dans Windy (windy.com/plugins, « Charger le plugin directement depuis l'URL ») :"
                    echo
                    echo "\`${URL:-voir la réponse ci dessous}\`"
                    echo
                    echo "Réponse brute de Windy :"
                    echo
                    echo '```'
                    cat /tmp/upload.json
                    echo
                    echo '```'
                  } >> "$GITHUB_STEP_SUMMARY"
                  echo "::notice title=Lien du plugin à partager::${URL:-voir le résumé du job}"
            - name: Save plugin URL
              if: steps.guard.outputs.skip != 'true' && env.PLUGIN_URL != ''
              run: |
                  git checkout -- src package.json
                  echo "$PLUGIN_URL" > PLUGIN_URL.txt
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add PLUGIN_URL.txt
                  git diff --cached --quiet || git commit -m "Lien du plugin publié"
                  git push || (git pull --rebase && git push)
