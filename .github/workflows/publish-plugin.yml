name: publish-plugin

# Publie le plugin sur windy-plugins.com (lancement manuel : Actions > publish-plugin > Run workflow).
# Prérequis : secret WINDY_API_KEY (clé "Windy Plugins API" créée sur https://api.windy.com/keys).

on:
    workflow_dispatch:

jobs:
    publish-plugin:
        runs-on: ubuntu-latest
        env:
            WINDY_API_KEY: '${{ secrets.WINDY_API_KEY }}'
        steps:
            - uses: actions/checkout@v7
            - name: Inject repository
              run: |
                  # Le plugin lit les trajectoires mises à jour chaque heure dans ce dépôt
                  sed -i "s#__RDR_REPO__#${GITHUB_REPOSITORY}#g" src/lib/config.ts src/pluginConfig.ts package.json
                  grep -n "const REPO\|repository:" src/lib/config.ts src/pluginConfig.ts
            - name: Build
              run: |
                  npm install
                  npm run build
            - name: Publish Plugin
              run: |
                  if [ -z "$WINDY_API_KEY" ]; then
                    echo "Secret WINDY_API_KEY is not configured" >&2
                    exit 1
                  fi
                  cd dist
                  echo "Creating plugin archive..."
                  echo "{\"repositoryName\": \"${{ github.repository }}\", \"commitSha\": \"${{ github.sha }}\", \"repositoryOwner\": \"${{ github.repository_owner }}\"}" > /tmp/plugin-info.json
                  mv plugin.json /tmp
                  jq -s '.[0] * .[1]' /tmp/plugin.json /tmp/plugin-info.json > plugin.json
                  tar cf ../plugin.tar .
                  echo "Publishing plugin..."
                  curl -s --fail-with-body -XPOST 'https://node.windy.com/plugins/v1.0/upload' -H "x-windy-api-key: ${WINDY_API_KEY}" -F "plugin_archive=@../plugin.tar" | tee /tmp/upload.json
                  echo
                  echo "::notice title=Lien du plugin à partager::$(grep -oE 'https://windy-plugins\.com/[^"]+plugin\.min\.js' /tmp/upload.json | head -1)"
